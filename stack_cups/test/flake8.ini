[flake8]
# ament_flake8's own defaults (ament_flake8/configuration/ament_flake8.ini), plus three
# relaxations for this project's style (roadmap 0.5), used throughout stack_cups:
#   Q000       double quotes instead of single quotes (flake8-quotes)
#   I100, I201 import grouping (flake8-import-order, google style)
# Those plugins are only reported where they are installed; lines stay within 99 chars.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000,I100,I201
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
