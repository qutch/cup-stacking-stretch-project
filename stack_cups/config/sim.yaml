# stack_cups parameters for the Stretch MuJoCo sim (roadmap 0.2).
#   ros2 launch stack_cups find_cup.launch.py config:=sim
#   ros2 run stack_cups find_cup --ros-args --params-file $(ros2 pkg prefix --share stack_cups)/config/sim.yaml
# Every parameter is set here and in robot.yaml (test_config.py checks they match
# stack_cups/params.py). Values marked "sim only" are workarounds the real robot must not use.
/**:
  ros__parameters:
    # ---------------------------------------------------------------- cups
    # Placeholder until the real cups are measured: a typical 16 oz party cup.
    # The sim scene (ros2 launch stack_cups sim.launch.py) builds its cups from these too.
    cup_height: 0.12
    cup_rim_diameter: 0.095
    cup_base_diameter: 0.06
    cup_wall: 0.003
    cup_mass: 0.02

    # ---------------------------------------------------------------- robot layer
    odom_topic: /odom
    joint_tries: 5            # sim only: the unpatched sim accepts a joint within 5 cm
    aborted_ok_tol: 0.05      # sim only: the unpatched sim aborts every goal, no message
    max_base_speed: 0.3
    max_turn_rate: 0.5
    switch_modes: true
    max_joint_speed_m: 0.0    # the sim ignores joint speeds
    max_joint_speed_rad: 0.0
    step_confirm: false

    # ---------------------------------------------------------------- find_cup
    steps: all
    aim_head: true
    head_pan: -1.57
    head_tilt: -0.6
    grasp: false
    show_windows: true
    gripper_open: 0.3         # fingertips ~12 cm apart: clears a 9.5 cm rim
    gripper_closed: -0.1
    gripper_fit_per_m: 6.24
    gripper_fit_offset: -0.284
    grasp_open_margin: 0.015
    gripper_squeeze: 0.05
    gripper_max_effort: 0.0   # the sim reports no gripper effort
    gripper_effort_rise: 0.0  # the sim reports no gripper effort
    gripper_step: 0.05
    grasp_check_lift: 0.08      # > grasp point to cup top
    grasp_slip_tol: 0.01
    carry_clearance: 0.05
    carry_wrist_yaw: 0.0       # straight: see params.py
    grasp_tries: 3
    red_hue_width: 10
    red_sat_min: 120
    red_val_min: 70
    red_min_area: 100
    ignore_taped: true
    tape_hue_min: 95         # the sim tape is blue
    tape_hue_max: 130
    tape_sat_min: 120
    tape_val_min: 60
    track_radius: 0.08
    split_min_rise: 0.015
    navigate: false
    nav_goal_x: 0.0
    nav_goal_y: 0.0
    nav_goal_yaw: 0.0
    nav_set_initial_pose: true
    nav_init_x: 0.0
    nav_init_y: 0.0
    nav_init_yaw: 0.0
    nav_timeout: 120.0
    square_up: true
    square_tol: 0.01
    square_tries: 3
    edge_distance: 0.55
    edge_tol: 0.03
    w_max: 0.3
    w_min: 0.08
    search_pan_step: 0.6
    search_pan_steps: 2
    search_tilt_up: 0.3
    search_drive_step: 0.4
    search_drive_max: 1.2
    search_samples: 3
    ready_above_cup: 0.05     # higher hides the cup from the head camera
    v_max: 0.3
    v_min: 0.06               # sim: worked before the wheel gear fix; lower is untested
    decel: 0.2
    drive_tol: 0.003
    align_tol: 0.008
    max_drives: 3
    settle_s: 0.3             # sim only: a new image every 0.1 s of sim time (3 renders)
    sample_dt: 0.1            # sim only: one sim render
    samples: 5
    max_spread: 0.01
    cup_height_tol: 0.03
    cup_height_strict: false
    grasp_height: 0.06
    grasp_reach_past: 0.0
    use_wrist_yaw: true
    max_yaw: 0.25
    arm_len: 0.270
    yaw_sign: 1.0
    yaw_check_tol: 0.010

    # ---------------------------------------------------------------- carry_to_stack
    # (roadmap task 2; also uses the cup, base-move, turning, tape colour, nav_timeout and
    # measuring values above)
    carry_steps: all
    # map poses [x, y, yaw]; the sim map's origin is the robot's start in the task scene
    start_pose: [0.0, 0.0, 0.0]
    loose_cups_pose: [0.2, 0.0, 0.0]
    stacking_pose: [0.75, 0.0, 0.0]   # tape 0.4 m ahead on the arm side, in view
    poses_checked: true
    robot_radius: 0.22
    carry_margin: 0.05
    require_cup: true
    held_min: 0.05
    grip_tol: 0.05
    tape_head_pan: -1.2
    tape_head_tilt: -0.7
    tape_search_pans: [-0.8, -0.4, -1.6, -2.0, -2.4]
    tape_max_spread: 0.01
    tape_square_tol: 0.02
    tape_square_tries: 5
    w_decel: 0.5
    reach_target: 0.31
    reach_tol: 0.12
    max_reach: 0.5
